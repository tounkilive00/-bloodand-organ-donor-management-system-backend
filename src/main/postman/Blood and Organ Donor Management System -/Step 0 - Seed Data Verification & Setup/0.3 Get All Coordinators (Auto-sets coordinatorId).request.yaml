$kind: http-request
url: http://localhost:8080/api/coordinators/all
method: GET
scripts:
  - type: afterResponse
    code: |-
      var data = pm.response.json();
      if (data && data.length > 0) {
          pm.collectionVariables.set('coordinatorId', data[0].id);
      }
    language: text/javascript
order: 3000
